<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.1, maximum-scale=10.0, user-scalable=yes">
<title>东明县居民养老保险待遇申领 - 5项业务1次办好</title>
<style>
*{margin:0;padding:0}
html,body{width:100%;min-height:100%}
html{-webkit-text-size-adjust:100%}
body{background:#333;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}

.info-bar{background:#8B0000;color:#fff;text-align:center;padding:10px 16px;font-size:14px;font-weight:700;line-height:1.4;-webkit-user-select:none;user-select:none}

/* 高清长图 - 原尺寸显示 */
.viewer{padding:6px;background:#f0ebe3;text-align:left}
.viewer img{display:block;width:1800px;max-width:none;height:auto;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.25);background:#fff}

.hint-bar{background:#f0ebe3;text-align:center;padding:6px 10px 2px;font-size:13px;color:#888}

/* 朋友圈版入口 */
.moments-entry{max-width:700px;margin:8px auto 0;padding:14px 16px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.12);display:flex;align-items:center;gap:16px}
.moments-entry .preview{width:80px;height:80px;border-radius:10px;flex-shrink:0;overflow:hidden;background:#f0ebe3}
.moments-entry .preview img{width:100%;height:100%;object-fit:cover}
.moments-entry .info{flex:1}
.moments-entry .info h3{font-size:15px;color:#8B0000;margin-bottom:4px}
.moments-entry .info p{font-size:13px;color:#666;line-height:1.5}
.moments-btn{display:inline-block;padding:8px 20px;background:#8B0000;color:#fff;border-radius:20px;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}

.footer{background:#8B0000;color:rgba(255,255,255,.7);text-align:center;padding:14px;font-size:12px;line-height:1.7;clear:both}
.footer strong{color:#FFD700}

@media(max-width:600px){.moments-entry{flex-wrap:wrap;justify-content:center;text-align:center}}
</style>
</head>
<body>

<div class="info-bar">📢 东明县居民养老保险待遇申领 · 5项业务1次办好</div>

<div class="hint-bar">👆 双指缩放 · 滑动查看 · 点击下方图片可保存到手机</div>

<div class="viewer">
  <img src="yanglao-hd.jpg" alt="东明县居民养老保险待遇申领海报（高清）" width="1800" height="2518">
</div>

<!-- 朋友圈版入口 -->
<div class="moments-entry">
  <div class="preview">
    <img src="yanglao-moments.jpg" alt="朋友圈版预览" loading="lazy">
  </div>
  <div class="info">
    <h3>📱 朋友圈快捷版</h3>
    <p>正方形排版，适合直接发朋友圈，文字更大更清晰</p>
  </div>
  <a href="yanglao-moments.jpg" download="东明养老保险-朋友圈版.jpg" class="moments-btn">📥 保存到手机</a>
</div>

<div class="footer">
  <strong>🌟 东明县人社局 · 高效办成一件事 🌟</strong><br>
  5项业务1次办好 · 不用跑腿不用烦 · 养老待遇轻松领<br>
  📢 把这个好消息告诉身边的家人朋友！
</div>

</body>
</html>
