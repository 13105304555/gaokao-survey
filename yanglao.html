<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>东明县居民养老保险待遇申领 - 5项业务1次办好</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f0ebe3}

/* 顶栏 */
.top-bar{background:#8B0000;color:#fff;text-align:center;padding:12px 16px;font-size:14px;font-weight:700;line-height:1.4}

/* 主内容 */
.main-wrap{padding:12px 10px;text-align:center}
.main-wrap .hint{font-size:13px;color:#888;padding:6px 0 10px}
.main-wrap .thumb-wrap{position:relative;display:inline-block;max-width:100%;border-radius:10px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.15);cursor:pointer}
.main-wrap .thumb-wrap img{display:block;width:100%;height:auto}
.main-wrap .thumb-wrap .tap-hint{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.6);color:#fff;padding:7px 20px;border-radius:20px;font-size:14px;
  pointer-events:none;white-space:nowrap;
}
.main-wrap .thumb-wrap:active{opacity:.9}

/* 朋友圈快捷版卡片 */
.m-card{max-width:500px;margin:12px auto 0;background:#fff;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.m-card .pre{width:70px;height:70px;border-radius:8px;overflow:hidden;flex-shrink:0}
.m-card .pre img{width:100%;height:100%;object-fit:cover}
.m-card .mi{flex:1;text-align:left}
.m-card .mi h4{font-size:14px;color:#8B0000;margin-bottom:2px}
.m-card .mi p{font-size:12px;color:#888;line-height:1.4}
.m-card a{flex-shrink:0;padding:7px 18px;background:#8B0000;color:#fff;border-radius:20px;text-decoration:none;font-size:13px;font-weight:600}

.footer{background:#8B0000;color:rgba(255,255,255,.7);text-align:center;padding:14px 16px;font-size:12px;line-height:1.7;margin-top:14px}
.footer strong{color:#FFD700}

/* ===== 全屏看图弹层 ===== */
@media(max-width:600px){.m-card{flex-wrap:wrap;justify-content:center}.m-card .mi{text-align:center}}
</style>
</head>
<body>

<div class="top-bar">📢 东明县居民养老保险待遇申领 · 5项业务1次办好</div>

<div class="main-wrap">
  <div class="hint">👆 点击图片全屏查看 · 双指缩放</div>
  
  <a href="yanglao-hd.jpg" style="text-decoration:none;display:inline-block;max-width:100%">
    <div class="thumb-wrap">
      <img src="yanglao-hd.jpg" alt="东明县居民养老保险待遇申领海报">
      <div class="tap-hint">🔍 点击查看大图（双指缩放）</div>
    </div>
  </a>

  <div class="m-card">
    <div class="pre"><img src="yanglao-moments.jpg" alt="朋友圈版" loading="lazy"></div>
    <div class="mi">
      <h4>📱 朋友圈版</h4>
      <p>正方形排版，适合直接发朋友圈</p>
    </div>
    <a href="yanglao-moments.jpg" download="东明养老保险-朋友圈版.jpg">📥 保存</a>
  </div>
</div>

<div class="footer">
  <strong>🌟 东明县人社局 · 高效办成一件事 🌟</strong><br>
  5项业务1次办好 · 不用跑腿不用烦 · 养老待遇轻松领<br>
  📢 把这个好消息告诉身边的家人朋友！
</div>


</body>
</html>
